name: Sync Upstream

on:
  schedule:
    - cron: '0 4 * * *' # Diariamente a las 04:00 UTC
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Upstream branch to sync (leave blank for auto-discovery >= 0.20)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    name: Check & Sync Upstream
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Discover and Fetch Upstream
        id: upstream
        run: |
          git remote add upstream https://github.com/jellyfin/jellyfin-androidtv.git 2>/dev/null || true
          git fetch upstream --tags

          TARGET="${{ github.event.inputs.target_branch }}"
          if [ -z "$TARGET" ]; then
            # Find active release branches >= release-0.20.z (ignoring < 0.20 and master)
            BRANCHES=$(git branch -r | grep 'upstream/release-' | sed 's/.*upstream\///' | sort -V)
            echo "Available upstream release branches:"
            echo "$BRANCHES"

            # Filter for release-0.X.z where X >= 20 or release-[1-9]*.z
            VALID_BRANCHES=$(echo "$BRANCHES" | grep -E '^release-(0\.(2[0-9]|[3-9][0-9])|[1-9][0-9]*)\.' || true)
            if [ -z "$VALID_BRANCHES" ]; then
              TARGET="release-0.20.z"
            else
              TARGET=$(echo "$VALID_BRANCHES" | tail -n 1)
            fi
          fi

          echo "Selected upstream target branch: $TARGET"
          echo "target_branch=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Evaluate Upstream Changes
        id: check
        run: |
          TARGET="${{ steps.upstream.outputs.target_branch }}"
          # Ensure local branch beta tracks origin/beta
          git checkout -B beta origin/beta || git checkout -B beta

          # Check new commits from upstream that are not in beta (HEAD)
          COMMITS=$(git log --oneline HEAD..upstream/"$TARGET" || true)

          if [ -z "$COMMITS" ]; then
            echo "Fork branch 'beta' is completely up to date with upstream/$TARGET. Nothing to do."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found new commits in upstream/$TARGET not yet in beta:"
            echo "$COMMITS"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "commit_count=$(echo "$COMMITS" | wc -l)" >> "$GITHUB_OUTPUT"
          fi

      - name: Integrate Upstream and Validate
        if: steps.check.outputs.has_changes == 'true'
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET="${{ steps.upstream.outputs.target_branch }}"
          echo "Attempting merge of upstream/$TARGET into beta..."

          git checkout beta

          if ! git merge --no-commit --no-ff upstream/"$TARGET"; then
            echo "Merge conflict detected! Restoring fork workflows first..."
            git checkout HEAD -- .github/workflows/ || true

            # Check if there are still unresolved conflicts
            UNRESOLVED=$(git diff --name-only --diff-filter=U || true)
            if [ -n "$UNRESOLVED" ]; then
              echo "Unresolvable merge conflicts detected in code files:"
              echo "$UNRESOLVED"
              git merge --abort || true

              SYNC_BRANCH="sync/upstream-${TARGET}-$(date +%Y%m%d%H%M)"
              git checkout -b "$SYNC_BRANCH"
              git merge upstream/"$TARGET" || true
              git checkout HEAD -- .github/workflows/ || true
              git push origin "$SYNC_BRANCH" --force

              gh pr create \
                --title "Upstream Sync Conflict: $TARGET" \
                --body "Se han detectado cambios upstream en \`upstream/$TARGET\` con conflictos que requieren resolución manual. Rama de trabajo: \`$SYNC_BRANCH\`." \
                --base beta \
                --head "$SYNC_BRANCH" || true

              exit 1
            fi
          fi

          # Always preserve fork workflows to prevent workflow permissions errors and keep fork custom CI
          git checkout HEAD -- .github/workflows/

          # --- Webtranslate duplicate-key sanitization -----------------------
          # Weblate merges regularly introduce duplicated <string name="...">
          # keys (Finnish in particular). Fix them BEFORE committing so beta
          # never carries unbuildable resources.
          STRINGS_TOOL=".github/scripts/strings-tools.py"
          RES_CHANGED=$(git diff --cached --name-only -- 'app/src/main/res/values*/strings.xml' || true)

          if [ -n "$RES_CHANGED" ] && [ -f "$STRINGS_TOOL" ]; then
            # 1) Finnish: take the pristine upstream copy (canonical translation set).
            if echo "$RES_CHANGED" | grep -qx 'app/src/main/res/values-fi/strings.xml'; then
              echo "Resetting app/src/main/res/values-fi/strings.xml to upstream/$TARGET"
              git checkout "upstream/$TARGET" -- 'app/src/main/res/values-fi/strings.xml' || true
            fi

            # 2) Structural cleanup of any remaining duplicate keys.
            DUP_FILES=""
            for f in $RES_CHANGED; do
              [ -f "$f" ] || continue
              COUNT=$(grep -Eo '<string[[:space:]]+name="[^"]+"' "$f" | sort | uniq -d | wc -l)
              if [ "$COUNT" -gt 0 ]; then
                DUP_FILES="$DUP_FILES $f"
              fi
            done

            if [ -n "$DUP_FILES" ]; then
              echo "Duplicate <string> keys detected in:$DUP_FILES -- cleaning before commit"
              # shellcheck disable=SC2086
              python3 "$STRINGS_TOOL" dedupe $DUP_FILES
            fi

            # 3) Hard gate: no duplicates, well-formed XML.
            # shellcheck disable=SC2086
            if ! python3 "$STRINGS_TOOL" verify $RES_CHANGED; then
              echo "Unrecoverable duplicate/invalid string resources after merge. Aborting sync."
              git merge --abort 2>/dev/null || true
              git reset --hard HEAD
              exit 1
            fi

            git add -- 'app/src/main/res/values*/strings.xml'
          elif [ -n "$RES_CHANGED" ]; then
            echo "::warning::$STRINGS_TOOL not found; skipping duplicate-key sanitization."
          fi
          # ------------------------------------------------------------------

          if git diff --cached --quiet; then
            echo "No changes after preserving fork workflows. Nothing to commit."
            exit 0
          fi

          git commit -m "chore(sync): merge upstream/$TARGET into beta preserving fork workflows"

          echo "Merge clean! Running test suite to ensure Direct Play patches remain compatible..."
          chmod +x gradlew
          if ! ./gradlew test --stacktrace; then
            echo "Tests failed after merge! Rolling back beta to its previous state..."
            MERGE_SHA=$(git rev-parse HEAD)
            git reset --hard HEAD~1

            # GitHub Issues is disabled on this fork (has_issues: false), so
            # `gh issue create` fails with a GraphQL error. Report through the
            # step summary + error annotation instead (never fatal).
            {
              echo "### :warning: Sync upstream/$TARGET: tests failed"
              echo ""
              echo "El merge de \`upstream/$TARGET\` en \`beta\` se aplicó limpiamente, pero \`./gradlew test\` falló."
              echo ""
              echo "- El merge fue revertido con \`git reset --hard HEAD~1\`: **beta no se ha modificado**."
              echo "- Resolución manual: \`git checkout -B beta origin/beta && git merge upstream/$TARGET\`, corregir los tests y relanzar este workflow."
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "::error title=Sync upstream/$TARGET failed tests::Merge was clean but ./gradlew test failed. beta left untouched; merge reverted."
            echo "Tests failed after merge. beta was NOT modified."

            # Best-effort commit comment on the (pushed) beta tip: the
            # commit-comments API works even when Issues are disabled,
            # unlike `gh issue create`.
            gh api -X POST "repos/${{ github.repository }}/commits/$(git rev-parse HEAD)/comments" \
              -f body="⚠️ Sync automática con \`upstream/$TARGET\` revertida: el merge (${MERGE_SHA:0:9}) fue limpio pero \`./gradlew test\` falló. beta no se ha modificado." \
              >/dev/null 2>&1 || echo "::notice::No se pudo publicar el comentario de commit (no bloqueante)."

            exit 1
          fi

          echo "Tests passed! Pushing to origin beta..."
          git push origin beta
          echo "Sync successful and pushed to beta."
